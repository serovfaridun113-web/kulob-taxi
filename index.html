<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кӯлоб Такси 🚕</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  padding:20px;
}

.box{
  max-width:400px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
}

h1{
  text-align:center;
}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  box-sizing:border-box;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
}

.result{
  margin-top:20px;
  padding:15px;
  background:#f2f2f2;
  border-radius:10px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>Кӯлоб Такси 🚕</h1>

<label>Масофа (км)</label>
<input type="number" id="km" min="0" step="0.1" placeholder="Масалан: 5">

<label>Роҳ</label>
<select id="road">
  <option value="city">Дар дохили шаҳр</option>
  <option value="outside">Берун аз шаҳр</option>
</select>

<button onclick="calculate()">Ҳисоб кардан</button>

<div class="result" id="result">
  Нарх: 10 сомонӣ
</div>

</div>

<script>
function calculate(){

  let km = parseFloat(document.getElementById("km").value) || 0;
  let road = document.getElementById("road").value;

  let price = 10;

  if(km > 3){

    let extraKm = km - 3;

    if(road === "city"){
      price += extraKm * 3;
    }else{
      price += extraKm * 4;
    }

  }

  document.getElementById("result").innerText =
    "Нарх: " + price.toFixed(2) + " сомонӣ";
}
</script>

</body>
</html>
